# Automatische Prüfungen bei jedem Pull Request und jeder Änderung an main.
# Die Prüfungen selbst stehen in pruefen.sh, damit sie lokal genauso laufen. Auf GitHub laufen
# sie in sechs Teilen gleichzeitig auf eigenen Rechnern (#307); jeder hat seine eigene Datenbank,
# sein eigenes Keycloak und dieselben Ports wie lokal. Die Gesamtprüfung „Alle Prüfungen
# (pruefen.sh)“ am Ende ist nur grün, wenn alle Teile grün sind.
#
# Übernommen aus sebivtt/scout-participant-management, .github/workflows/ci.yml, Stand 9df4513.
# Angepasst: ohne Vue-Oberfläche; eine Python-Fassung (3.13, festgelegt in .python-version)
# statt drei; Pakete über uv; Tests gegen eine echte PostgreSQL-Datenbank; fremde Bausteine
# auf eine feste Fassung (Commit) festgelegt, damit eine spätere Änderung dort nicht
# unbemerkt mitläuft.
name: Prüfungen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ein neuer Stand im selben Pull Request bricht den alten Lauf ab und spart Freiminuten.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Teil ${{ matrix.teil }} (pruefen.sh)
    # Feste Ubuntu-Fassung statt „ubuntu-latest“: Als GitHub am 27.10.2026 auf Ubuntu 26.04
    # umstellte, startete WebKit von Playwright nicht mehr (fehlende Systembibliothek libicu 74),
    # und jeder Rauchtest in WebKit war rot (#192). Ein Wechsel der Fassung kommt bewusst mit
    # eigenem Pull Request, sobald Playwright sie unterstützt.
    runs-on: ubuntu-24.04
    # 35 Minuten je Teil: Vorlauf, Installation des Browsers (bis 5), Warten auf Keycloak und bis
    # zu 25 Minuten Prüfungen müssen hineinpassen (#256, #276, #307). Hängt die Installation,
    # endet der Teil ohnehin nach ihren 5 Minuten rot.
    timeout-minutes: 35
    strategy:
      # Jeder Teil läuft zu Ende, auch wenn ein anderer rot ist; so sieht man alle Befunde auf einmal.
      fail-fast: false
      # Dieselben Teile wie in pruefen.sh („./pruefen.sh teile“); tests/test_pruefung_auf_github.py
      # vergleicht beide. Nur die Teile mit Rauchtest brauchen einen Browser, jeder nur seinen.
      matrix:
        include:
          - teil: grund
          - teil: tests-1
          - teil: tests-2
          - teil: rauchtest-chromium
            browser: chromium
          - teil: rauchtest-firefox
            browser: firefox
          - teil: rauchtest-webkit
            browser: webkit
    services:
      postgres:
        # Dieselbe feste Fassung wie in testumgebung/docker-compose.yml (#324), damit jeder Lauf dieselbe
        # Datenbank hat; tests/test_pruefung_auf_github.py vergleicht alle Stellen (#349).
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: dpv
          POSTGRES_PASSWORD: nur-in-der-pruefung
          POSTGRES_DB: dpv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dpv -d dpv"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Erfundene Werte nur für diesen Prüflauf, kein Geheimnis.
      DJANGO_SECRET_KEY: nur-in-der-pruefung-nicht-geheim
      POSTGRES_DB: dpv
      POSTGRES_USER: dpv
      POSTGRES_PASSWORD: nur-in-der-pruefung
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Keycloak-Testumgebung aus dev/keycloak/dpv-realm.json (#5), erfundene Werte.
      KEYCLOAK_REALM_URL: http://localhost:8080/realms/dpv
      KEYCLOAK_CLIENT_ID: dpv-anmeldetool
      KEYCLOAK_CLIENT_SECRET: nur-lokal-nicht-geheim
      # Admin der Keycloak-Testumgebung (Schritt „Keycloak-Testumgebung starten“), nur für die
      # Tests der Importdatei des Test-Realms (#62); das Tool selbst nutzt nie einen Admin-Zugang.
      KEYCLOAK_DEV_ADMIN_PASSWORD: nur-in-der-pruefung
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Der Prüflauf führt Code aus dem Pull Request aus; der Zugangsschlüssel von
          # GitHub soll danach nicht mehr im Ordner liegen.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: true
      # Keycloak läuft nicht als Dienst wie PostgreSQL, weil Dienste auf GitHub keinen eigenen
      # Startbefehl und keine Dateien aus dem Repo bekommen können. Gleiche Fassung und gleiche
      # Testumgebung wie in dev/docker-compose.yml.
      - name: Keycloak-Testumgebung starten
        run: |
          docker run -d --name keycloak -p 127.0.0.1:8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=nur-in-der-pruefung \
            -v "$PWD/dev/keycloak/dpv-realm.json:/opt/keycloak/data/import/dpv-realm.json:ro" \
            quay.io/keycloak/keycloak:26.7.5 start-dev --import-realm
      - name: Python und Pakete aus uv.lock installieren
        run: uv sync --locked
      # Browser für den Rauchtest (#7) in der Fassung, die zu Playwright aus uv.lock gehört,
      # samt den Systembibliotheken, die sie unter Linux brauchen. Beides kommt aus dem
      # Zwischenspeicher von GitHub, in einem Eintrag je Browser (#307), Playwright-Fassung und
      # Stand der installierten Systempakete des GitHub-Rechners (#396). Ist der Eintrag gefüllt, fragt der Teil den
      # Ubuntu-Paketserver gar nicht an, auch nicht für die Paketlisten: Früher holte jeder Lauf die
      # Systembibliotheken dort, und war der Server langsam, scheiterte die Installation (#133, #276,
      # #396). Ist der Eintrag leer (erster Lauf nach einem Update des GitHub-Rechners oder von
      # Playwright), installiert der Teil wie bisher vom Paketserver und füllt danach den Eintrag.
      # Dafür bleibt: ein Versuch mit 5 Minuten, denn ein zweiter im selben Lauf half nur 3 von 7 Mal,
      # ein Neustart auf einem neuen Rechner fast immer (#276). Klappte die Installation vom
      # Paketserver, dauerte sie meist unter 1,2 Minuten, bisher höchstens 4,2.
      - name: Playwright-Fassung aus uv.lock ermitteln
        id: playwright
        if: matrix.browser
        run: |
          version="$(uv run --locked python -c "import importlib.metadata as m; print(m.version('playwright'))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Ubuntu-Fassung (ImageOS, etwa „ubuntu24“) und ein Fingerabdruck aller installierten Pakete
          # mit ihren Fassungen: Nach einem Update des Rechners kommen so keine Pakete von vorher auf
          # den neuen Rechner, und nach einem Wechsel der Ubuntu-Fassung keine alten Browser (#192).
          # Nicht die Fassungsnummer des Rechners (ImageVersion): GitHub verteilt die Teile eines Laufs
          # auf Rechner mit verschiedenen Nummern; sind sie gleich bestückt, teilen sie sich so den
          # Eintrag (#396, Nachklärung vom 20.11.2026).
          pakete="$(dpkg-query -W -f='${binary:Package}=${Version}\n' | sort | sha256sum | cut -c1-16)"
          echo "abbild=$ImageOS-$pakete" >> "$GITHUB_OUTPUT"
      - name: Browser und Systempakete aus dem Zwischenspeicher holen
        id: zwischenspeicher
        if: matrix.browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/systempakete
          key: playwright-${{ steps.playwright.outputs.abbild }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Browser für den Rauchtest installieren
        id: browser
        if: matrix.browser
        timeout-minutes: 5
        # Scheitert oder hängt die Installation, meldet das der nächste Schritt und beendet den Teil.
        continue-on-error: true
        run: |
          if [ "${{ steps.zwischenspeicher.outputs.cache-hit }}" = true ]; then
            # Gefüllt: Die Systempakete installiert apt aus dem Ordner, ohne etwas herunterzuladen.
            # Den Ordner muss apt auch als seine Ablage kennen, sonst findet es die Dateien nicht.
            if ls "$HOME/systempakete"/*.deb > /dev/null 2>&1; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-download -o Dir::Cache::Archives="$HOME/systempakete/" "$HOME/systempakete"/*.deb
            fi
            # Der Browser liegt schon da; das prüft nur seine Fassung.
            uv run --locked playwright install ${{ matrix.browser }}
          else
            # Leer: wie bisher vom Paketserver. apt behält dabei die geladenen Pakete in einem eigenen
            # Ordner; die kommen danach in den Zwischenspeicher.
            archiv="$RUNNER_TEMP/apt-archiv"
            sudo mkdir -p "$archiv/partial"
            sudo chown _apt "$archiv/partial"
            printf 'Dir::Cache::Archives "%s/"; Binary::apt-get::APT::Keep-Downloaded-Packages "true";\n' "$archiv" | sudo tee /etc/apt/apt.conf.d/99-systempakete-behalten > /dev/null
            uv run --locked playwright install --with-deps ${{ matrix.browser }}
            mkdir -p "$HOME/systempakete"
            find "$archiv" -maxdepth 1 -name '*.deb' -exec cp -t "$HOME/systempakete/" {} +
          fi
      - name: Browser-Installation gescheitert
        if: steps.browser.outcome == 'failure'
        run: |
          echo "::error title=Browser-Installation gescheitert::Der Test-Browser ließ sich nicht in 5 Minuten installieren, meist weil der Ubuntu-Paketserver gerade langsam ist. Kein Test ist gelaufen (betroffen ist nur dieser Teil); am Code liegt es nicht. Ein Neustart nur der gescheiterten Teile (Re-run failed jobs) hilft meist (#133, #276, #307)."
          exit 1
      # Gleich nach der Installation und nicht erst am Ende des Teils, damit auch ein roter Test den
      # Eintrag gefüllt zurücklässt (#396). Das Hochladen dauert Sekunden; misslingt es, meldet GitHub
      # nur eine Warnung, und der nächste Lauf installiert wieder vom Paketserver.
      - name: Browser und Systempakete im Zwischenspeicher ablegen
        if: matrix.browser && steps.browser.outcome == 'success' && steps.zwischenspeicher.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/systempakete
          key: ${{ steps.zwischenspeicher.outputs.cache-primary-key }}
      - name: Warten, bis Keycloak bereit ist
        run: |
          for attempt in $(seq 1 90); do
            curl -fsS http://localhost:8080/realms/dpv/.well-known/openid-configuration > /dev/null && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - name: Prüfungen dieses Teils
        id: pruefen
        # Eigenes Limit, damit ein hängender Test den Teil nicht bis zum Limit des Teils blockiert
        # (#256, #307).
        timeout-minutes: 25
        env:
          # Hier schreibt pruefen.sh das Ergebnis des Teils für die Gesamtprüfung hin.
          PRUEFTEIL_ERGEBNIS: ${{ runner.temp }}/${{ matrix.teil }}
          # Hier legen die Rauchtests die Aufzeichnung jedes roten Tests ab (rauchtests/conftest.py, #349).
          RAUCHTEST_SPUREN: ${{ runner.temp }}/belege
        run: ./pruefen.sh teil ${{ matrix.teil }}
      # Belege bei Rot (#349): Ist ein Rauchtest rot, kommen seine Aufzeichnung und das Protokoll von Keycloak
      # an den Lauf (unten auf der Seite des Laufs, „Artifacts“), damit sich etwa ein Hänger beim Anmelden
      # nachvollziehen lässt. Beides enthält nur die erfundenen Testdaten. Je Versuch ein eigener Name, damit
      # ein Neustart die Belege des ersten Versuchs nicht ersetzt.
      - name: Protokoll von Keycloak sichern
        if: failure() && steps.pruefen.outcome == 'failure' && matrix.browser
        run: |
          mkdir -p "$RUNNER_TEMP/belege"
          docker logs keycloak > "$RUNNER_TEMP/belege/keycloak.log" 2>&1
      - name: Belege des roten Rauchtests hochladen
        if: failure() && steps.pruefen.outcome == 'failure' && matrix.browser
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belege-${{ matrix.teil }}-versuch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/belege
          retention-days: 30
      # Auch bei Rot, damit die Gesamtprüfung den roten Teil nennt. Fehlt die Datei, weil der Teil
      # vorher abgebrochen ist, findet die Gesamtprüfung kein Ergebnis und ist rot. Beim Neustart
      # gescheiterter Teile ersetzt das neue Ergebnis das alte.
      - name: Ergebnis des Teils weitergeben
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ergebnis-${{ matrix.teil }}
          path: ${{ runner.temp }}/${{ matrix.teil }}
          if-no-files-found: ignore
          overwrite: true

  gesamt:
    # Gleicher Name wie früher der eine Lauf: „grün“ heißt weiter „alle Prüfungen grün“.
    name: Alle Prüfungen (pruefen.sh)
    needs: pruefen
    # Läuft immer, auch wenn ein Teil rot, abgebrochen oder gar nicht gelaufen ist; dann ist sie rot.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Lesen der Ergebnisse aller Teile über die Schnittstelle von GitHub.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Nur das Skript; die Gesamtprüfung braucht weder Python noch Pakete.
          sparse-checkout: pruefen.sh
          sparse-checkout-cone-mode: false
      # Über die Schnittstelle für den ganzen Lauf statt actions/download-artifact: Nach „Re-run
      # failed jobs“ müssen auch die Ergebnisse der grünen Teile aus dem ersten Versuch da sein.
      # Fehlt ein Ergebnis, meldet das der nächste Schritt für diesen Teil.
      - name: Ergebnisse der Teile holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ergebnisse"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'ergebnis-*' --dir "$RUNNER_TEMP/geholt" ||
            echo "::warning title=Ergebnisse::Nicht alle Ergebnisse ließen sich holen; fehlende Teile sind gleich rot."
          # Je Teil eine Datei mit seinem Namen, egal in welchem Unterordner gh sie ablegt.
          [ ! -d "$RUNNER_TEMP/geholt" ] || find "$RUNNER_TEMP/geholt" -type f -exec cp {} "$RUNNER_TEMP/ergebnisse/" \;
      - name: Ergebnisse aller Teile zusammenfassen
        run: ./pruefen.sh gesamt "$RUNNER_TEMP/ergebnisse"
      - name: Alle Teile beendet und grün
        if: always() && needs.pruefen.result != 'success'
        run: |
          echo "::error title=ROT::Nicht alle Teile sind grün beendet (Ergebnis: ${{ needs.pruefen.result }}). Die roten oder abgebrochenen Teile stehen oben in der Liste des Laufs."
          exit 1

# Automatische Prüfungen bei jedem Pull Request und jeder Änderung an main.
# Die Prüfungen selbst stehen in pruefen.sh, damit sie lokal genauso laufen.
#
# Übernommen aus sebivtt/scout-participant-management, .github/workflows/ci.yml, Stand 9df4513.
# Angepasst: ohne Vue-Oberfläche; eine Python-Fassung (3.13, festgelegt in .python-version)
# statt drei; Pakete über uv; Tests gegen eine echte PostgreSQL-Datenbank; fremde Bausteine
# auf eine feste Fassung (Commit) festgelegt, damit eine spätere Änderung dort nicht
# unbemerkt mitläuft.
name: Prüfungen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ein neuer Stand im selben Pull Request bricht den alten Lauf ab und spart Freiminuten.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Alle Prüfungen (pruefen.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dpv
          POSTGRES_PASSWORD: nur-in-der-pruefung
          POSTGRES_DB: dpv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dpv -d dpv"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Erfundene Werte nur für diesen Prüflauf, kein Geheimnis.
      DJANGO_SECRET_KEY: nur-in-der-pruefung-nicht-geheim
      POSTGRES_DB: dpv
      POSTGRES_USER: dpv
      POSTGRES_PASSWORD: nur-in-der-pruefung
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Keycloak-Testumgebung aus dev/keycloak/dpv-realm.json (#5), erfundene Werte.
      KEYCLOAK_REALM_URL: http://localhost:8080/realms/dpv
      KEYCLOAK_CLIENT_ID: dpv-anmeldetool
      KEYCLOAK_CLIENT_SECRET: nur-lokal-nicht-geheim
      # Admin der Keycloak-Testumgebung (Schritt „Keycloak-Testumgebung starten“), nur für die
      # Tests der Importdatei des Test-Realms (#62); das Tool selbst nutzt nie einen Admin-Zugang.
      KEYCLOAK_DEV_ADMIN_PASSWORD: nur-in-der-pruefung
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Der Prüflauf führt Code aus dem Pull Request aus; der Zugangsschlüssel von
          # GitHub soll danach nicht mehr im Ordner liegen.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: true
      # Keycloak läuft nicht als Dienst wie PostgreSQL, weil Dienste auf GitHub keinen eigenen
      # Startbefehl und keine Dateien aus dem Repo bekommen können. Gleiche Fassung und gleiche
      # Testumgebung wie in dev/docker-compose.yml.
      - name: Keycloak-Testumgebung starten
        run: |
          docker run -d --name keycloak -p 127.0.0.1:8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=nur-in-der-pruefung \
            -v "$PWD/dev/keycloak/dpv-realm.json:/opt/keycloak/data/import/dpv-realm.json:ro" \
            quay.io/keycloak/keycloak:26.7.5 start-dev --import-realm
      - name: Python und Pakete aus uv.lock installieren
        run: uv sync --locked
      # Browser für den Rauchtest (#7) in der Fassung, die zu Playwright aus uv.lock gehört,
      # samt den Systembibliotheken, die sie unter Linux brauchen. Die Systembibliotheken kommen
      # vom Ubuntu-Paketserver; ist der langsam, hing der Schritt früher bis zum Zeitlimit des
      # ganzen Laufs (#133). Deshalb: je Versuch 10 Minuten, höchstens drei Versuche, und die
      # Browser selbst kommen aus dem Zwischenspeicher von GitHub, solange die Fassung gleich ist.
      # Die Systembibliotheken holt jeder Lauf weiter vom Paketserver; der Zwischenspeicher allein
      # verhindert den Hänger also nicht.
      - name: Playwright-Fassung aus uv.lock ermitteln
        id: playwright
        run: |
          version="$(uv run --locked python -c "import importlib.metadata as m; print(m.version('playwright'))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Browser aus dem Zwischenspeicher holen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Browser für den Rauchtest installieren (Versuch 1 von 3)
        id: browser_versuch_1
        timeout-minutes: 10
        continue-on-error: true
        run: false && uv run --locked playwright install --with-deps chromium firefox webkit
      - name: Browser für den Rauchtest installieren (Versuch 2 von 3)
        id: browser_versuch_2
        if: steps.browser_versuch_1.outcome == 'failure'
        timeout-minutes: 10
        continue-on-error: true
        run: |
          echo "::warning title=Browser-Installation::Versuch 1 ist gescheitert oder hing länger als 10 Minuten; neuer Versuch (#133)."
          # Reste des abgebrochenen Versuchs beenden. GitHub beendet beim Zeitlimit nur den Schritt
          # selbst; Playwright und apt-get können weiterlaufen und apt gesperrt halten. Die eckigen
          # Klammern verhindern, dass pkill seinen eigenen Aufruf trifft. apt wartet danach bis zu
          # zwei Minuten auf die Sperre, statt sofort zu scheitern.
          pkill -f '[p]laywright.*install' || true
          sudo pkill -x apt-get || true
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99-auf-sperre-warten > /dev/null
          false && uv run --locked playwright install --with-deps chromium firefox webkit
      - name: Browser für den Rauchtest installieren (Versuch 3 von 3)
        id: browser_versuch_3
        if: steps.browser_versuch_2.outcome == 'failure'
        timeout-minutes: 10
        continue-on-error: true
        run: |
          echo "::warning title=Browser-Installation::Versuch 2 ist gescheitert oder hing länger als 10 Minuten; letzter Versuch (#133)."
          pkill -f '[p]laywright.*install' || true
          sudo pkill -x apt-get || true
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99-auf-sperre-warten > /dev/null
          false && uv run --locked playwright install --with-deps chromium firefox webkit
      - name: Browser-Installation gescheitert
        if: steps.browser_versuch_3.outcome == 'failure'
        run: |
          echo "::error title=Browser-Installation gescheitert::Die Test-Browser ließen sich in drei Versuchen nicht installieren, meist weil der Ubuntu-Paketserver gerade langsam ist. Kein Test ist gelaufen; am Code liegt es nicht. Ein Neustart des Laufs (Re-run jobs) hilft meist (#133)."
          exit 1
      - name: Warten, bis Keycloak bereit ist
        run: |
          for attempt in $(seq 1 90); do
            curl -fsS http://localhost:8080/realms/dpv/.well-known/openid-configuration > /dev/null && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - name: Alle Prüfungen
        run: ./pruefen.sh

# Automatische Prüfungen bei jedem Pull Request und jeder Änderung an main.
# Die Prüfungen selbst stehen in pruefen.sh, damit sie lokal genauso laufen. Auf GitHub laufen
# sie in sechs Teilen gleichzeitig auf eigenen Rechnern (#307); jeder hat seine eigene Datenbank,
# sein eigenes Keycloak und dieselben Ports wie lokal. Die Gesamtprüfung „Alle Prüfungen
# (pruefen.sh)“ am Ende ist nur grün, wenn alle Teile grün sind.
#
# Übernommen aus sebivtt/scout-participant-management, .github/workflows/ci.yml, Stand 9df4513.
# Angepasst: ohne Vue-Oberfläche; eine Python-Fassung (3.13, festgelegt in .python-version)
# statt drei; Pakete über uv; Tests gegen eine echte PostgreSQL-Datenbank; fremde Bausteine
# auf eine feste Fassung (Commit) festgelegt, damit eine spätere Änderung dort nicht
# unbemerkt mitläuft.
name: Prüfungen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ein neuer Stand im selben Pull Request bricht den alten Lauf ab und spart Freiminuten.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Teil ${{ matrix.teil }} (pruefen.sh)
    # Feste Ubuntu-Fassung statt „ubuntu-latest“: Als GitHub am 27.10.2026 auf Ubuntu 26.04
    # umstellte, startete WebKit von Playwright nicht mehr (fehlende Systembibliothek libicu 74),
    # und jeder Rauchtest in WebKit war rot (#192). Ein Wechsel der Fassung kommt bewusst mit
    # eigenem Pull Request, sobald Playwright sie unterstützt.
    runs-on: ubuntu-24.04
    # 35 Minuten je Teil: Vorlauf, Installation des Browsers (bis 5), Warten auf Keycloak und bis
    # zu 25 Minuten Prüfungen müssen hineinpassen (#256, #276, #307). Hängt die Installation,
    # endet der Teil ohnehin nach ihren 5 Minuten rot.
    timeout-minutes: 35
    strategy:
      # Jeder Teil läuft zu Ende, auch wenn ein anderer rot ist; so sieht man alle Befunde auf einmal.
      fail-fast: false
      # Dieselben Teile wie in pruefen.sh („./pruefen.sh teile“); tests/test_pruefung_auf_github.py
      # vergleicht beide. Nur die Teile mit Rauchtest brauchen einen Browser, jeder nur seinen.
      matrix:
        include:
          - teil: grund
          - teil: tests-1
          - teil: tests-2
          - teil: rauchtest-chromium
            browser: chromium
          - teil: rauchtest-firefox
            browser: firefox
          - teil: rauchtest-webkit
            browser: webkit
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dpv
          POSTGRES_PASSWORD: nur-in-der-pruefung
          POSTGRES_DB: dpv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dpv -d dpv"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Erfundene Werte nur für diesen Prüflauf, kein Geheimnis.
      DJANGO_SECRET_KEY: nur-in-der-pruefung-nicht-geheim
      POSTGRES_DB: dpv
      POSTGRES_USER: dpv
      POSTGRES_PASSWORD: nur-in-der-pruefung
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Keycloak-Testumgebung aus dev/keycloak/dpv-realm.json (#5), erfundene Werte.
      KEYCLOAK_REALM_URL: http://localhost:8080/realms/dpv
      KEYCLOAK_CLIENT_ID: dpv-anmeldetool
      KEYCLOAK_CLIENT_SECRET: nur-lokal-nicht-geheim
      # Admin der Keycloak-Testumgebung (Schritt „Keycloak-Testumgebung starten“), nur für die
      # Tests der Importdatei des Test-Realms (#62); das Tool selbst nutzt nie einen Admin-Zugang.
      KEYCLOAK_DEV_ADMIN_PASSWORD: nur-in-der-pruefung
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Der Prüflauf führt Code aus dem Pull Request aus; der Zugangsschlüssel von
          # GitHub soll danach nicht mehr im Ordner liegen.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: true
      # Keycloak läuft nicht als Dienst wie PostgreSQL, weil Dienste auf GitHub keinen eigenen
      # Startbefehl und keine Dateien aus dem Repo bekommen können. Gleiche Fassung und gleiche
      # Testumgebung wie in dev/docker-compose.yml.
      - name: Keycloak-Testumgebung starten
        run: |
          docker run -d --name keycloak -p 127.0.0.1:8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=nur-in-der-pruefung \
            -v "$PWD/dev/keycloak/dpv-realm.json:/opt/keycloak/data/import/dpv-realm.json:ro" \
            quay.io/keycloak/keycloak:26.7.5 start-dev --import-realm
      - name: Python und Pakete aus uv.lock installieren
        run: uv sync --locked
      # Browser für den Rauchtest (#7) in der Fassung, die zu Playwright aus uv.lock gehört,
      # samt den Systembibliotheken, die sie unter Linux brauchen. Die Systembibliotheken kommen
      # vom Ubuntu-Paketserver; ist der langsam, hing der Schritt früher bis zum Zeitlimit des
      # ganzen Laufs (#133). Deshalb: ein Versuch mit 5 Minuten, und die Browser selbst kommen aus
      # dem Zwischenspeicher von GitHub, solange die Fassung gleich ist. Die Systembibliotheken holt
      # jeder Lauf weiter vom Paketserver; der Zwischenspeicher allein verhindert den Hänger also
      # nicht. Ein zweiter Versuch im selben Lauf half 3 von 7 Mal, ein Neustart des Laufs auf einem
      # neuen Rechner fast immer (#276). Klappt die Installation, dauert sie meist unter 1,2 Minuten,
      # bisher höchstens 4,2. Seit #307 installiert jeder Teil mit Rauchtest nur seinen Browser, die
      # anderen Teile keinen.
      - name: Playwright-Fassung aus uv.lock ermitteln
        id: playwright
        if: matrix.browser
        run: |
          version="$(uv run --locked python -c "import importlib.metadata as m; print(m.version('playwright'))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ubuntu=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Browser aus dem Zwischenspeicher holen
        if: matrix.browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Mit der Ubuntu-Fassung (ImageOS des Rechners, etwa „ubuntu24“) im Schlüssel, weil Playwright
          # je Fassung eigene Browser lädt; sonst kämen nach einem Wechsel die alten aus dem
          # Zwischenspeicher (#192). Je Browser ein eigener Eintrag, weil jeder Teil nur seinen
          # Browser installiert (#307).
          key: playwright-browser-${{ steps.playwright.outputs.ubuntu }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Browser für den Rauchtest installieren
        id: browser
        if: matrix.browser
        timeout-minutes: 5
        # Scheitert oder hängt die Installation, meldet das der nächste Schritt und beendet den Teil.
        continue-on-error: true
        run: uv run --locked playwright install --with-deps ${{ matrix.browser }}
      - name: Browser-Installation gescheitert
        if: steps.browser.outcome == 'failure'
        run: |
          echo "::error title=Browser-Installation gescheitert::Der Test-Browser ließ sich nicht in 5 Minuten installieren, meist weil der Ubuntu-Paketserver gerade langsam ist. Kein Test ist gelaufen (betroffen ist nur dieser Teil); am Code liegt es nicht. Ein Neustart nur der gescheiterten Teile (Re-run failed jobs) hilft meist (#133, #276, #307)."
          exit 1
      - name: Warten, bis Keycloak bereit ist
        run: |
          for attempt in $(seq 1 90); do
            curl -fsS http://localhost:8080/realms/dpv/.well-known/openid-configuration > /dev/null && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - name: Prüfungen dieses Teils
        # Eigenes Limit, damit ein hängender Test den Teil nicht bis zum Limit des Teils blockiert
        # (#256, #307).
        timeout-minutes: 25
        env:
          # Hier schreibt pruefen.sh das Ergebnis des Teils für die Gesamtprüfung hin.
          PRUEFTEIL_ERGEBNIS: ${{ runner.temp }}/${{ matrix.teil }}
        run: ./pruefen.sh teil ${{ matrix.teil }}
      # Auch bei Rot, damit die Gesamtprüfung den roten Teil nennt. Fehlt die Datei, weil der Teil
      # vorher abgebrochen ist, findet die Gesamtprüfung kein Ergebnis und ist rot. Beim Neustart
      # gescheiterter Teile ersetzt das neue Ergebnis das alte.
      - name: Ergebnis des Teils weitergeben
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ergebnis-${{ matrix.teil }}
          path: ${{ runner.temp }}/${{ matrix.teil }}
          if-no-files-found: ignore
          overwrite: true

  gesamt:
    # Gleicher Name wie früher der eine Lauf: „grün“ heißt weiter „alle Prüfungen grün“.
    name: Alle Prüfungen (pruefen.sh)
    needs: pruefen
    # Läuft immer, auch wenn ein Teil rot, abgebrochen oder gar nicht gelaufen ist; dann ist sie rot.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Nur das Skript; die Gesamtprüfung braucht weder Python noch Pakete.
          sparse-checkout: pruefen.sh
          sparse-checkout-cone-mode: false
      - name: Ergebnisse der Teile holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # Fehlt jedes Ergebnis, meldet das der nächste Schritt je Teil.
        continue-on-error: true
        with:
          pattern: ergebnis-*
          merge-multiple: true
          path: ${{ runner.temp }}/ergebnisse
      - name: Ergebnisse aller Teile zusammenfassen
        run: ./pruefen.sh gesamt "$RUNNER_TEMP/ergebnisse"
      - name: Alle Teile beendet und grün
        if: always() && needs.pruefen.result != 'success'
        run: |
          echo "::error title=ROT::Nicht alle Teile sind grün beendet (Ergebnis: ${{ needs.pruefen.result }}). Die roten oder abgebrochenen Teile stehen oben in der Liste des Laufs."
          exit 1

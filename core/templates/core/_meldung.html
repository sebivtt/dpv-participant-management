{% load i18n layout %}<div class="a-meldung {{ css_class }}" role="{{ role }}"{% if element_id %} id="{{ element_id }}"{% endif %}{% if short %} data-kurz{% endif %}><span class="sr-nur">{{ prefix }} </span><span class="a-meldung-ic" aria-hidden="true">{% icon icon_name %}</span><div class="a-meldung-text">{% if title %}<strong class="a-meldung-titel">{{ title }}</strong>{% endif %}{% if text %}<p>{{ text }}</p>{% endif %}</div>{% if short %}<button type="button" class="a-kurz-zu" aria-label="{% translate "Meldung schließen" %}" hidden>{% icon "schliessen" %}</button>{% endif %}</div>

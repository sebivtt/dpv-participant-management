{% load layout %}{# Überschrift einer Fläche mit Symbol im Kästchen davor (#161). Mit heading_id verweist die Fläche darauf (aria-labelledby); level 3 für eine Fläche unter einer Überschrift der Ebene 2. #}
<div class="a-flaeche-kopf"><span class="a-flaeche-ic">{% icon symbol %}</span>{% if level == 3 %}<h3{% if heading_id %} id="{{ heading_id }}"{% endif %}>{{ title }}</h3>{% else %}<h2{% if heading_id %} id="{{ heading_id }}"{% endif %}>{{ title }}</h2>{% endif %}</div>

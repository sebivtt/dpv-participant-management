# Kurze Paketliste (CONTRIBUTING.md, Abschnitt 6). Die Liste mit festen Fassungen
# erzeugt uv daraus in uv.lock; sie wird nie von Hand bearbeitet.
# Paket hinzufügen: uv add <paket>, nur zum Prüfen: uv add --dev <paket>.

[project]
name = "dpv-anmeldetool"
version = "0.1.0"
description = "Anmelde- und Veranstaltungstool für den DPV e.V."
readme = "README.md"
license = "EUPL-1.2"
# Genau Python 3.13: Auf einem Mac liegen oft mehrere Python-Fassungen. Ohne feste
# Grenze nahm uv einmal Python 3.11 und wich still auf Django 5.2 aus.
requires-python = "==3.13.*"
dependencies = [
    "django>=6.1,<6.2",
    "django-allauth[socialaccount]>=65.20.1",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.12",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "playwright>=1.64",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.14",
]

[tool.uv]
# Das Tool ist eine Anwendung, kein Paket zum Weitergeben.
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
# Ein als bekannter Fehler markierter Test, der plötzlich besteht, macht den Lauf rot
# (CONTRIBUTING.md, Abschnitt 3).
xfail_strict = true
addopts = "-rxX"
